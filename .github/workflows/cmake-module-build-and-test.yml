name: cmake-module-build-and-test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cmake-module-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b #v4.1.5
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@802fa1a2c4e212495c05bf94dba2704a92a472be #v2.0.2
        with:
          cmake-version: '3.29.x'
      # C++ modules need a generator with support for them, so we cannot use the default
      # ("Unix Makefiles"); and CMake's dependency scanning needs clang >= 16 (the runner's
      # default gcc is too old to scan).
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Generate
        run: >
          cmake -S . -B cmake/build -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DAU_BUILD_MODULE=TRUE
      - name: Build the module and its test
        run: cmake --build cmake/build --target au_module module_test
      - name: Run the module test
        run: ctest --test-dir cmake/build -R AuModule --output-on-failure
