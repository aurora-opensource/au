# TEMPORARY workflow, for collecting the MSVC compiler errors that go in the troubleshooting guide.
# It is not meant to be merged to `main`: run it on a scratch branch, read the errors out of the job
# logs, paste them into `docs/troubleshooting.md`, and drop this file.
#
# We compile each SECTION of `au/error_examples.cc` as its own translation unit, because MSVC will
# suppress later errors when several of them appear in the same TU.

name: generate-msvc-troubleshooting

on:
  push:
    branches:
      - chiphogg/msvc-troubleshoot-0.6.0

jobs:
  collect-msvc-errors:
    strategy:
      fail-fast: false
      matrix:
        windows_version: [windows-2022, windows-2025]

    runs-on: ${{ matrix.windows_version }}

    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b #v4.1.5

      - name: Set up developer command prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 #v1.13.0

      - name: Set up python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f #v5.1.1
        with:
          python-version: '3.10'

      - name: Record compiler version
        shell: cmd
        continue-on-error: true
        run: cl.exe /Bv

      - name: Build single-file package
        shell: cmd
        run: python tools/bin/make-single-file --units bytes feet hertz hours inches meters miles seconds --version-id NA > au.hh

      - name: Split error examples into one file per section
        shell: cmd
        run: python tools/bin/split-error-examples --single-file --outdir sections

      - name: Compile each section on its own
        shell: cmd
        continue-on-error: true
        run: |
          for %%f in (sections\*.cc) do (
            echo ==================== BEGIN %%~nf
            copy /y %%f error_examples.cc > NUL
            cl.exe /std:c++14 /nologo /c /Fo:NUL error_examples.cc 2>&1
            echo ==================== END %%~nf
          )
