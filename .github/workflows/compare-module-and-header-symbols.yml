name: compare-module-and-header-symbols

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  compare-module-and-header-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b #v4.1.5
      - name: Set up python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f #v5.1.1
        with:
          python-version: '3.10'
      - name: Check that the module's exports match the headers' public symbols
        run: ./tools/bin/check-module-exports
