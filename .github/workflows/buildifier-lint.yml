name: buildifier-lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-buildifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Run the same `buildifier` that `tools/bin/buildifier` uses locally (the
      # `@com_github_bazelbuild_buildtools` archive pinned in `MODULE.bazel`), so CI and local can
      # never disagree on formatting the way they would with an independently-versioned buildifier.
      # Collect the files here rather than using `buildifier -r`: we need to match whole names
      # (`BUILD.bazel`, `MODULE.bazel`, `WORKSPACE`) as well as an extension (`*.bzl`), and we need
      # to skip `third_party/`, whose vendored `BUILD.bazel` files do not lint clean.
      - name: Check bazel files
        run: |
          find . -type f \
            \( -name 'BUILD.bazel' -o -name 'MODULE.bazel' -o -name 'WORKSPACE' -o -name '*.bzl' \) \
            -not -path './third_party/*' -print0 |
            xargs --null --no-run-if-empty tools/bin/buildifier \
              --lint=warn --mode=check --warnings=all
