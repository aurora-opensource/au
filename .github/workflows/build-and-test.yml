name: build-and-test

on:
  workflow_call:
    inputs:
      config:
        required: true
        type: string
      cpp20_extra_args:
        required: false
        type: string
        description: "Additional Bazel arguments for the C++20 test step (e.g., tag filters)"
      container:
        required: false
        type: string
        default: ""
        description: "Docker image to run the job in (e.g., to decouple prebuilt toolchains from the runner image)"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: ${{ inputs.container }}

    steps:
      - name: Install container dependencies
        if: ${{ inputs.container != '' }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl g++ git libxml2 python3
          curl -fsSL -o /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b #v4.1.5
      - name: Mark checkout as safe for git inside container
        if: ${{ inputs.container != '' }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build and test (${{ inputs.config }})
        run: bazel test --config=${{ inputs.config }} --copt=-Werror //...:all
      - name: Build and test with -Wconversion (${{ inputs.config }})
        run: bazel test --config=${{ inputs.config }} --copt=-Werror --copt=-Wconversion --test_tag_filters=-no_wconversion --build_tag_filters=-no_wconversion //au/...:all
      - name: Build and test in C++20 mode (${{ inputs.config }})
        run: bazel test --config=${{ inputs.config }} --copt=-Werror --copt=-std=c++20 ${{ inputs.cpp20_extra_args }} //...:all //au:cpp20_test //au:std_format_test
      - name: Build and test with -Wsign-conversion
        run: bazel build --config=${{ inputs.config }} --copt=-Werror --copt=-Wsign-conversion --test_tag_filters=-no_wsign_conversion --build_tag_filters=-no_wsign_conversion //au/...:all //release/...:all
